name: graph

# Index the project into a throw-away graph store and fail the build on findings
# that docs/graph/baseline.json does not accept (a layering violation, say).
# `make graph-check` runs the same command locally. What the findings are, and how
# the baseline works: docs/specs/SPEC_GRAPH_INDEXER.md (Phase 6).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  findings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Index the project and gate on new findings
        # --dir is a scratch directory, so nothing here can collide with a dev
        # server's lock. --calls also checks that the module type-checks. To index
        # the git history too, add --git and give checkout `fetch-depth: 0`.
        run: >-
          go run ./cmd/govibe graph index
          --dir "$RUNNER_TEMP/govibe-graph"
          --calls
          --fail-on error
          --baseline docs/graph/baseline.json
          --format github
