name: ci

# The framework's tests, run both ways (the default build and the govibe_dev build the
# dev tools are compiled into), the production check (a default build links and serves
# no dev tooling, acceptance scenario A7 of SPEC_FRAMEWORK_EXTRACTION), the dev panel
# check, the API check against the last release, and the keystone: the framework tests
# its own output (A1, A2, A4, A6, A7).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build both ways
        run: |
          go build ./... ./examples/hello/...
          go build -tags govibe_dev ./... ./examples/hello/...
      - name: Vet
        run: go vet ./... ./examples/hello/...
      - name: Test (default build)
        run: go test ./... ./examples/hello/...
      - name: Test (dev tools compiled in)
        run: go test -tags govibe_dev ./... ./examples/hello/...

  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the reference app the way a deployment does (no dev tag)
        run: go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/hello" ./examples/hello
      - name: No dev package is linked
        # The same check as TestDefaultBuildLinksNoDevTools, on the shipped binary's own dependency list.
        run: |
          if go list -deps -tags '' ./examples/hello | grep -E 'cayleygraph|modelcontextprotocol|golang.org/x/tools|yuin/goldmark|alecthomas/chroma|govibe/internal/(devtools|codegraph|dbexplorer|devmcp|graphdb)'; then
            echo "the default build links dev tooling"; exit 1
          fi
      - name: Serve it, and find no dev tooling
        run: |
          # From outside the repository, so the app's files come from what the binary embeds
          # (in a development environment the framework would serve ./assets from disk).
          cd "$RUNNER_TEMP"
          APP_ENV=dev PORT=18080 "$RUNNER_TEMP/hello" &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 50); do curl -fs localhost:18080/api/hello >/dev/null && break; sleep 0.2; done
          [ "$(curl -s localhost:18080/api/hello)" = '{"message":"Hello GoVibe!"}' ]
          for p in /dev /dev/graph /dev/docs /dev/docs/app /dev/docs/govibe/guide /dev/db /dev/schedule /dev/schedule/data /dev/mcp /_govibe/static/graph.js /assets/static/graph.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:18080$p")
            [ "$code" = 404 ] || { echo "$p answered $code, want 404"; exit 1; }
          done
          for p in /assets/static/theme.css /assets/static/home.css /assets/static/govibe-logo.png /assets/static/govibe-hero.png /_govibe/static/htmx.min.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "localhost:18080$p")
            [ "$code" = 200 ] || { echo "$p answered $code, want 200 (is the embed complete?)"; exit 1; }
          done
          if curl -s localhost:18080/ | grep -q 'href="/dev'; then echo "the page links to /dev in a build that has none"; exit 1; fi
          # The scheduler is not dev tooling: its listing works in the production binary with no database,
          # no server and no environment (A9). The reference app schedules nothing.
          out=$("$RUNNER_TEMP/hello" schedule list)
          echo "$out" | grep -q 'No command declares a Schedule' || { echo "schedule list: $out"; exit 1; }
          "$RUNNER_TEMP/hello" schedule list --json | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["tasks"]==[] and d["scheduler"]["enabled"] is True, d'
          # Nothing is scheduled: `schedule run` refuses (status 1) instead of idling (timeout's 124).
          rc=0; timeout 10 "$RUNNER_TEMP/hello" schedule run >/dev/null 2>&1 || rc=$?
          [ "$rc" = 1 ] || { echo "schedule run exited $rc, want 1 (the refusal); 124 means it idled"; exit 1; }

  devpanel:
    # The dev build of the reference app, judged through the panel's own agent surface:
    # the app's routes must resolve to the app's code (an application is a module of its
    # own, so the indexer cannot find it by where the indexer was compiled), and the app
    # must have no findings of its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the reference app with the dev tools
        run: go build -tags govibe_dev -o "$RUNNER_TEMP/hello-dev" ./examples/hello
      - name: Serve it from its own directory and ask the graph about a route
        run: |
          cd examples/hello
          APP_ENV=dev PORT=18081 "$RUNNER_TEMP/hello-dev" &
          pid=$!
          trap 'kill $pid' EXIT
          ask() {
            curl -s -X POST localhost:18081/dev/mcp -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"$1\",\"arguments\":$2}}" |
              python3 -c 'import sys,json; raw=sys.stdin.read(); l=[x for x in raw.splitlines() if x.startswith("data:")]; d=json.loads(l[0][5:] if l else raw); print(json.dumps(d["result"].get("structuredContent", {})))'
          }
          for i in $(seq 1 60); do
            handler=$(ask graph_context '{"route":"GET /api/hello"}' 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get("handler",{}).get("id",""))' 2>/dev/null || true)
            [ "$handler" = "func:controllers.HelloAPI" ] && break
            sleep 1
          done
          [ "$handler" = "func:controllers.HelloAPI" ] || { echo "GET /api/hello did not resolve to func:controllers.HelloAPI (got '$handler')"; exit 1; }
          findings=$(curl -s localhost:18081/dev/graph/data/findings | python3 -c 'import sys,json; print(len(json.load(sys.stdin)["findings"]))')
          [ "$findings" = 0 ] || { echo "the reference app has $findings finding(s) in its own panel"; curl -s localhost:18081/dev/graph/data/findings; exit 1; }
          # The panel is about the app: the graph, the findings and the agent tools default to the app's own
          # scope, and the framework is one switch away, labelled (acceptance A3, A8 and A10).
          schema=$(ask graph_schema '{}')
          echo "$schema" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["scope"]=="app" and d["app"]["name"]=="hello" and d["framework"]["version"], d["app"]'
          app_mw=$(ask graph_context '{"route":"GET /api/hello"}' | python3 -c 'import sys,json; print(len(json.load(sys.stdin).get("middleware") or []))')
          [ "$app_mw" = 0 ] || { echo "the app scope shows the framework middleware"; exit 1; }
          ask graph_context '{"route":"GET /api/hello","scope":"all"}' | python3 -c 'import sys,json; d=json.load(sys.stdin); assert [m["origin"] for m in d["middleware"]] and all(m["origin"]=="framework" for m in d["middleware"]), d["middleware"]'
          curl -s localhost:18081/dev/graph/data/view | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["preset"]=="app_map" and d["scope"]=="app"; assert not [n for n in d["nodes"] if n["origin"]!="app" or n["label"].startswith("GET /dev") or n["kind"]=="external"], d["nodes"]'
          curl -s "localhost:18081/dev/graph/data/view?scope=all" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert [n for n in d["nodes"] if n["origin"]=="framework"]'
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:18081/dev)" = 200 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:18081/dev/docs/govibe/guide)" = 200 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:18081/dev/docs/govibe-specs)" = 404 ] # the framework's specs are never in an app
          # The scheduler's page and agent tool answer even when nothing is scheduled, and say how to declare one (A9).
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:18081/dev/schedule)" = 200 ]
          curl -s localhost:18081/dev/schedule/data | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["state"]=="none" and d["tasks"]==[] and d["how_to_declare"], d'
          ask schedule_status '{}' | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["state"]=="none" and d["how_to_declare"], d'
          curl -s localhost:18081/dev/graph/data/status | python3 -c 'import sys,json; d=json.load(sys.stdin); assert "commands" in [l["name"] for l in d["freshness"]["layers"]], d'


  api:
    # The public surface against the last release: gorelease reports what changed in the
    # public packages since the last tag (before 1.0 a minor may break them; the notes in
    # docs/public/UPGRADING.md must say so). Nothing to compare until the first tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Compare the public API with the last release
        run: |
          base=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$base" ]; then echo "no release yet: nothing to compare"; exit 0; fi
          go run golang.org/x/exp/cmd/gorelease@latest -base="$base"

  keystone:
    # The framework tests its own output: `govibe new` from this checkout into a temp
    # directory, a scheduled command from the overlay, both builds, the tests, the gate
    # with an empty baseline, the demo and the dev endpoints of a booted dev build, the
    # 404s of a production build, no dev package in the default build, no spec in the
    # tree, and the rules failing a planted violation. The test is internal/scaffold's
    # TestKeystone; `make keystone` runs it locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Scaffold an app from the working tree and exercise it
        run: GOVIBE_KEYSTONE=1 go test ./internal/scaffold -run TestKeystone -v -timeout 30m
