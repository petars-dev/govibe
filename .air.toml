root = "."
tmp_dir = "tmp"

[build]
  # Delegate to the Makefile so templ generation always runs before the build.
  cmd = "make air-build"
  bin = "tmp/hello-dev"
  # The app is examples/hello, but Air runs from the repository root so a change to the
  # framework rebuilds it too; GOVIBE_ROOT tells the app where its own files are.
  full_bin = "GOVIBE_ROOT=examples/hello APP_ENV=dev LOG_LEVEL=debug ./tmp/hello-dev"
  include_ext = ["go", "templ", "yml", "yaml"]
  exclude_dir = ["tmp", "docs", ".git", ".idea"]
  # Skip templ's generated output so it doesn't retrigger a rebuild loop.
  exclude_regex = ["_templ\\.go$"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"
  log = "build-errors.log"

[log]
  time = true

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = true
  keep_scroll = true
