# The framework's own settings and their defaults. Embedded in the config package and
# layered under the application's env.yml (the project root): the app's file wins,
# maps merge deeply, lists are replaced. Values are `${ENV:default}` placeholders,
# resolved from the process environment.
env: ${APP_ENV:local}

# The application's root directory. What must not depend on the directory the process
# was started from (the dev assets directory, the graph store) resolves against it.
# Empty: the nearest directory above the working directory that holds govibe.yml or go.mod.
root: ${GOVIBE_ROOT:}

server:
  # Port the HTTP server listens on.
  port: ${PORT:8080}
  # Log level for logrus: panic,fatal,error,warn,info,debug,trace
  log_level: ${LOG_LEVEL:info}

database:
  # Goose migration dialect (mysql, postgres, sqlite3, ... — see
  # github.com/pressly/goose/v3). Goose defaults to postgres if never told
  # otherwise, which silently breaks migrations against any other database,
  # so this is always set explicitly rather than left implicit.
  type: ${DATABASE_TYPE:mysql}
  mariadb:
    # DSN example: user:pass@tcp(127.0.0.1:3306)/traceloop?parseTime=true&multiStatements=true
    dsn: ${MARIADB_DSN:}

# Dev-only tooling (see /dev/db, /dev/graph, /dev/mcp). Never mounted in production.
dev:
  db:
    # Enables db_insert_test_row / db_reset_test_data and the equivalent /dev/db
    # mutation endpoints, for seeding or clearing fixtures in test builds. Has
    # no effect in production regardless of this flag.
    allow_mutations: ${DEV_DB_ALLOW_MUTATIONS:false}
  # Opt-in layers of the project graph (/dev/graph, the graph_* MCP tools). Both are
  # off by default because they cost more than parsing; `graph_reindex` with the
  # layer's name switches one on for the life of the server without these.
  graph:
    # Index which function calls which (type-checks the module, about a second).
    # With it a route's path to a table is exact; without it, estimated from imports.
    calls: ${GRAPH_CALLS:true}
    # Index last commit, churn and the files that change together (runs `git log`).
    git: ${GRAPH_GIT:false}
