env: ${APP_ENV:local}

server:
  port: ${PORT:8080}

database:
  # A sensitive key: its default must never reach the graph.
  dsn: ${FIXTURE_DSN:user:pass@tcp(db)/fixture}
  max_conns: ${FIXTURE_DB_MAX_CONNS:10}

auth:
  # Declared and bound to a struct field, but nothing reads it.
  api_key: ${FIXTURE_API_KEY:s3cret}

# Only reachable through config.Get, never through the struct.
queue:
  broker:
    host: ${BROKER_HOST:}
    port: ${BROKER_PORT:587}
    password: ${BROKER_PASSWORD:hunter2}

# A static value: no environment variable behind it.
region: eu-west-1

unused:
  flag: ${FIXTURE_UNUSED_FLAG:off}
