# govibe.yml: the project profile of the framework's own repository (see
# internal/profile and docs/specs/SPEC_FRAMEWORK_EXTRACTION.md, "Project profile").
# Everything not named here is the default profile, the layout of a generated app.

# The framework keeps its defaults in config/defaults.yml (embedded by package config);
# it has no env.yml of its own, as an app does.
config: [config/defaults.yml]

layout:
  # The packages that assemble the process: the root, the tool and the kernel that boots an app.
  wiring: [".", cmd, internal/kernel]
  # The dev tooling: hosted in the app process, never part of a default build.
  dev: [internal/devtools, internal/devmcp]
